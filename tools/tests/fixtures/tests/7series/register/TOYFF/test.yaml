primitive: TOYFF
family: 7series
work_unit: toy
doc_refs: [{guide: UG953, version: "2026.1", section: TOYFF, page: 1}]
tests:
  - id: 7series.TOYFF.L1.capture
    level: L1
    style: vector
    source: vectors/gen.py:l1_capture
    exercises: [port:D, claim:TOYFF.C1]
    attr_sampling: {INIT: [0, 1]}
    runners: {python: "yes", xsim: "yes", iverilog: "yes", verilator: "yes", hw: "unsupported"}
    unsupported_reasons: {hw: "toy"}
    flows: [rtl]
    related: []
    gaps: []
  - id: 7series.TOYFF.L0.reject
    level: L0
    style: vector
    source: vectors/gen.py:l0_reject
    exercises: [claim:TOYFF.R1]
    attr_sampling: {INIT: ["1'bx"]}
    runners: {python: "yes", xsim: "yes", iverilog: "yes", verilator: "yes", hw: "unsupported"}
    unsupported_reasons: {hw: "toy"}
    flows: [rtl]
    related: []
    gaps: []
  - id: 7series.TOYFF.L1.sv_basic
    level: L1
    style: sv
    source: sv/tb_toyff_basic.sv
    exercises: [port:D, claim:TOYFF.C1]
    attr_sampling: {}
    configs: [{cfg: default, attrs: {}}]
    runners: {python: "no", xsim: "yes", iverilog: "yes", verilator: "yes", hw: "unsupported"}
    unsupported_reasons: {python: "sv testbench", hw: "toy"}
    flows: [rtl]
    related: []
    gaps: []
  - id: 7series.TOYFF.L2.cocotb_capture
    level: L2
    style: cocotb
    source: cocotb/cocotb_toyff.py
    exercises: [port:D, claim:TOYFF.C1]
    attr_sampling: {INIT: [0, 1]}
    configs: [{cfg: init0, attrs: {INIT: 0}}, {cfg: init1, attrs: {INIT: 1}}]
    runners: {python: "no", xsim: "unsupported", iverilog: "yes", verilator: "yes", hw: "unsupported"}
    unsupported_reasons: {python: "cocotb test", xsim: "cocotb has no xsim backend", hw: "toy"}
    flows: [rtl]
    related: []
    gaps: []
