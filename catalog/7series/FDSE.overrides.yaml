# flops work unit: corrections and claims layered over the generated FDSE.yaml.
# Clean room: every fact below is from UG953 v2026.1 (FDSE, pp. 378-379).
#
# Attributes: no override. The generated INIT/IS_*_INVERTED `allowed` lists are
# already the 1-bit pair UG953 gives (the "1'b0 to 1'b1" range cells resolve to it).
#
# Crosses: none declared. UG953 documents each IS_*_INVERTED and INIT on its own
# (p379) and describes no interaction between any two attributes, so a pairwise
# cross would be a bin without a documented behaviour behind it.
# S (synchronous set) keeps the generated class `data`: UG953 p378 samples it at the
# clock edge (logic table: S=1 with C rising gives Q=1), so it has
# port:S:0/1 bins and no `active` level (that applies to async/gate ports only).
claims:
  - {id: FDSE.C1, page: 378, provenance: "doc:378", text: "With CE High and S inactive, Q takes D at the active clock edge."}
  - {id: FDSE.C2, page: 378, provenance: "doc:378", text: "With CE Low, clock edges are ignored and Q holds."}
  - {id: FDSE.C3, page: 378, provenance: "doc:378", text: "Active S overrides all other inputs, CE Low included; Q goes High at the next active clock edge."}
  - {id: FDSE.C4, page: 378, provenance: "doc:378", text: "While GSR is active (power-up or asserted) Q takes the INIT value."}
  - {id: FDSE.C5, page: 379, provenance: "doc:379", text: "IS_C_INVERTED=1 makes the register negative-edge triggered."}
  - {id: FDSE.C6, page: 379, provenance: "doc:379", text: "IS_S_INVERTED=1 makes S active-Low."}
  - {id: FDSE.C7, page: 379, provenance: "doc:379", text: "IS_D_INVERTED=1 inverts the D input."}
  - {id: FDSE.C8, page: 379, provenance: "doc:379", text: "IS_D_INVERTED must stay 0 unless the flop is used as an I/O register."}
