# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  # Branch pushes are covered by their pull_request run; only main runs on push,
  # so a PR commit never runs the job twice.
  push:
    branches: [main]
  pull_request:
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true, fetch-depth: 0}
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # --locked: fail if uv.lock is out of date with pyproject.toml instead of re-resolving.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check tools models
      - run: uv run ruff format --check tools models
      - run: uv run pytest -v -n auto --dist loadfile
      - run: uv run xut lint
      - name: xut lint --branch (branch-path ownership)
        if: github.event_name == 'pull_request'
        env:
          # actions/checkout leaves a PR build on a detached HEAD (the merge ref), not
          # the PR's actual branch, so current_branch() can't discover it from git.
          XUT_BRANCH: ${{ github.head_ref }}
        run: uv run xut lint --branch --base "origin/${{ github.base_ref }}"
  # Which CI work the change needs (tools/xut/ci_select.py). Fail-safe: only a pull
  # request whose every changed file is a log/spec/plan/README/AGENTS.md skips the sim
  # steps; anything else, or any doubt, runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      sim: ${{ steps.select.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: select
        run: python3 tools/xut/ci_select.py --event "${{ github.event_name }}" --base "origin/${{ github.base_ref }}"
  sim:
    # Always runs, so its check is reported on every PR; the steps skip when
    # the changes job says nothing they read changed.
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - if: needs.changes.outputs.sim != 'true'
        run: echo "docs/logs-only change, see the changes job - sim steps skipped"
      - if: needs.changes.outputs.sim == 'true'
        uses: actions/checkout@v4
        with: {submodules: true}
      - if: needs.changes.outputs.sim == 'true'
        uses: astral-sh/setup-uv@v3
      - if: needs.changes.outputs.sim == 'true'
        run: uv sync --locked --extra dev
      # Build xut-sim:1 (the SIM_IMAGE of tools/xut/container.py) with the GitHub
      # Actions layer cache, so the Verilator source build is not redone on every run.
      - if: needs.changes.outputs.sim == 'true'
        uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.sim == 'true'
        uses: docker/build-push-action@v6
        with:
          context: containers/sim
          load: true
          tags: xut-sim:1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: needs.changes.outputs.sim == 'true'
        run: uv run xut container versions
      - if: needs.changes.outputs.sim == 'true'
        run: uv run pytest -v -n auto --dist loadfile -m container
      # The flops L0/L1 vector tests on iverilog against the open-source UNISIM submodule
      # (review (b) #5). Until the flops unit has tests, `unit:flops` selects nothing and
      # both steps exit 0 with "no tests selected".
      - if: needs.changes.outputs.sim == 'true'
        run: uv run xut run 'unit:flops' --level L0 --level L1 --style vector --runner python --runner iverilog --model-source unisim-gh-2020.1 --jobs 4
      - if: needs.changes.outputs.sim == 'true'
        run: uv run xut crosscheck 'unit:flops' --model-source unisim-gh-2020.1
