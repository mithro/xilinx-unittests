# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  # Branch pushes are covered by their pull_request run; only main runs on push,
  # so a PR commit never runs the job twice.
  push:
    branches: [main]
  pull_request:
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: true, fetch-depth: 0}
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # --locked: fail if uv.lock is out of date with pyproject.toml instead of re-resolving.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check tools models
      - run: uv run ruff format --check tools models
      - run: uv run pytest -v -n auto --dist loadfile
      - run: uv run xut lint
      - name: xut lint --branch (branch-path ownership)
        if: github.event_name == 'pull_request'
        env:
          # actions/checkout leaves a PR build on a detached HEAD (the merge ref), not
          # the PR's actual branch, so current_branch() can't discover it from git.
          XUT_BRANCH: ${{ github.head_ref }}
        run: uv run xut lint --branch --base "origin/${{ github.base_ref }}"
  # Which CI work the change needs (tools/xut/ci_select.py). Fail-safe: only a pull
  # request whose every changed file is a log/spec/plan/README/AGENTS.md skips the sim
  # steps; anything else, or any doubt, runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      sim: ${{ steps.select.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: select
        run: python3 tools/xut/ci_select.py --event "${{ github.event_name }}" --base "origin/${{ github.base_ref }}"
  sim-shard:
    # The container tests, split over parallel runners (tools/xut/ci_shards.py: the
    # shards partition `-m container` exactly, checked by test_ci_shards.py). Each leg
    # always runs (unless cancelled); its steps skip only on an explicit sim=false, and
    # it fails if `changes` failed (fail-safe: never green without its steps).
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [sweep, verilator, rest]
    steps:
      - if: needs.changes.result != 'success'
        run: |
          echo "the changes job did not succeed (${{ needs.changes.result }}): failing"
          exit 1
      - if: needs.changes.outputs.sim == 'false'
        run: echo "docs/logs-only change, see the changes job - sim steps skipped"
      - if: needs.changes.outputs.sim != 'false'
        uses: actions/checkout@v4
        with: {submodules: true}
      - if: needs.changes.outputs.sim != 'false'
        uses: astral-sh/setup-uv@v3
      - if: needs.changes.outputs.sim != 'false'
        run: uv sync --locked --extra dev
      # Build xut-sim:1 (the SIM_IMAGE of tools/xut/container.py) with the GitHub
      # Actions layer cache, so the Verilator source build is not redone on every run.
      - if: needs.changes.outputs.sim != 'false'
        uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.sim != 'false'
        uses: docker/build-push-action@v6
        with:
          context: containers/sim
          load: true
          tags: xut-sim:1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: needs.changes.outputs.sim != 'false'
        run: uv run xut container versions
      # This shard's pytest arguments (tools/xut/ci_shards.py), written to a file first so
      # a failing ci_shards.py fails the step (bash -e) instead of leaving no arguments.
      - if: needs.changes.outputs.sim != 'false'
        env: {SHARD: "${{ matrix.shard }}"}
        run: |
          python3 tools/xut/ci_shards.py "$SHARD" > "$RUNNER_TEMP/pytest-args"
          mapfile -t args < "$RUNNER_TEMP/pytest-args"
          uv run pytest "${args[@]}"
      # The flops L0/L1 vector tests on iverilog against the open-source UNISIM submodule,
      # in the `rest` shard only (ci_shards.FLOPS_SHARD; test_ci_shards pins it)
      # (review (b) #5). `xut run` exits 1 on any fail, including a disagreement that a
      # test lists in `expected_divergence` (an open finding, spec §8), so it only runs
      # here and prints its matrix; `xut crosscheck` is the gate. It exits 0 only when
      # every disagreement is a listed known-divergence, 3 on an unlisted finding and
      # 4 on any error, unexplained fail or missing comparison, so nothing is masked.
      # `xut run` exit 1 means some result is fail or error: crosscheck classifies those.
      # Anything above 1 (interrupt 130, a crash) fails the job here.
      - if: needs.changes.outputs.sim != 'false' && matrix.shard == 'rest'
        run: |
          rc=0
          uv run xut run 'unit:flops' --level L0 --level L1 --style vector --runner python --runner iverilog --model-source unisim-gh-2020.1 --jobs 4 || rc=$?
          echo "xut run exit $rc"
          [ "$rc" -le 1 ]
      # --strict with the same selection: any selected test the run did not complete
      # (not-run or uncompared) is exit 4, so a partial run never looks clean.
      - if: needs.changes.outputs.sim != 'false' && matrix.shard == 'rest'
        run: uv run xut crosscheck 'unit:flops' --level L0 --level L1 --style vector --model-source unisim-gh-2020.1 --strict
  # The check every PR reports as `sim`: green only when every shard leg passed.
  sim:
    needs: sim-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - env: {RESULT: "${{ needs.sim-shard.result }}"}
        run: |
          echo "sim-shard: $RESULT"
          test "$RESULT" = success
